services:
  web:
    image: ghcr.io/royi386/birthday:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*"
      DATABASE_PATH: /data/db.sqlite3
      MEDIA_ROOT: /media
    ports:
      - "5175:5175"
    volumes:
      - odds-data:/data
      - odds-media:/media
      - odds-static:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5175/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  backup:
    profiles: ["backup"]
    image: ghcr.io/royi386/birthday:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*"
      DATABASE_PATH: /data/db.sqlite3
      MEDIA_ROOT: /media
    depends_on:
      web:
        condition: service_healthy
    entrypoint: ["python", "manage.py"]
    command: ["backup_data", "--output=/backups", "--loop"]
    volumes:
      - odds-data:/data:ro
      - odds-media:/media:ro
      - odds-backups:/backups
volumes:
  odds-data:
  odds-media:
  odds-static:
  odds-backups:
