{% extends 'base.html' %}{% block title %}Display settings{% endblock %}{% block content %}<div class="page-heading"><div><p class="eyebrow">TV DISPLAY</p><h1>Display settings</h1><p class="muted">Changes apply to the public display on its next refresh.</p></div><a class="button secondary" target="_blank" href="{% url 'display_birthdays' %}">Preview ↗</a></div><form method="post" enctype="multipart/form-data" class="panel form-panel">{% csrf_token %}<div class="form-grid">{% for field in form %}<label class="field"><span>{{ field.label }}</span>{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{% for error in field.errors %}<small class="field-error">{{ error }}</small>{% endfor %}</label>{% endfor %}</div><div class="form-actions"><button class="button primary">Save display settings</button></div></form>{% endblock %}
